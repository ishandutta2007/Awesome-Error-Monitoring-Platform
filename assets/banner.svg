<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a1a4e;#0f0c29" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#302b63">
        <animate attributeName="stop-color" values="#302b63;#4834d4;#302b63" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#24243e">
        <animate attributeName="stop-color" values="#24243e;#6c5ce7;#24243e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glowing pulse filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline animation -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="12"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.08" stroke="#00ff88" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Scanning line animation -->
  <rect x="0" y="0" width="900" height="40" fill="url(#scanline)" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,-40;0,200;0,-40" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated orbiting dots -->
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="4" fill="#ff6b6b" opacity="0.9">
      <animate attributeName="cy" values="60;140;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="100" r="3" fill="#00ff88" opacity="0.8">
      <animate attributeName="cy" values="140;60;140" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100" r="2.5" fill="#ffd93d" opacity="0.7">
      <animate attributeName="cy" values="80;120;80" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="100" r="2.5" fill="#6c5ce7" opacity="0.7">
      <animate attributeName="cy" values="120;80;120" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bug icon (animated pulse) -->
  <g transform="translate(70, 70)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    <!-- Bug body -->
    <ellipse cx="30" cy="35" rx="18" ry="22" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
    <!-- Bug head -->
    <circle cx="30" cy="12" r="8" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <!-- Antennae -->
    <line x1="24" y1="6" x2="16" y2="-4" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="6" x2="44" y2="-4" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="-4" r="2" fill="#ff6b6b"/>
    <circle cx="44" cy="-4" r="2" fill="#ff6b6b"/>
    <!-- Legs left -->
    <line x1="14" y1="25" x2="2" y2="18" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13" y1="35" x2="0" y2="35" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="45" x2="2" y2="52" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Legs right -->
    <line x1="46" y1="25" x2="58" y2="18" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="47" y1="35" x2="60" y2="35" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="46" y1="45" x2="58" y2="52" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Head split -->
    <line x1="30" y1="4" x2="30" y2="20" stroke="#ff6b6b" stroke-width="1"/>
    <!-- Body segment lines -->
    <line x1="14" y1="30" x2="46" y2="30" stroke="#ff6b6b" stroke-width="0.8" opacity="0.5"/>
    <line x1="13" y1="40" x2="47" y2="40" stroke="#ff6b6b" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Shield icon -->
  <g transform="translate(720, 55)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    <path d="M30 0 L60 15 L60 40 C60 60 30 75 30 75 C30 75 0 60 0 40 L0 15 Z" fill="none" stroke="#00ff88" stroke-width="2.5"/>
    <polyline points="18,38 27,48 44,28" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="2s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- Animated code snippets on sides -->
  <g font-family="monospace" font-size="10" fill="#00ff88" opacity="0.25">
    <text x="20" y="170">
      <tspan>try { monitor(); }</tspan>
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="30" text-anchor="end">
      <tspan>catch (err) {</tspan>
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="180" text-anchor="end">
      <tspan>sentry.capture(e)</tspan>
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Pulsing heartbeat line (error waveform) -->
  <g opacity="0.3">
    <polyline points="180,155 220,155 240,155 260,130 270,175 280,100 290,180 300,120 310,155 350,155 390,155 410,135 420,170 430,110 440,165 450,155 490,155 530,155 550,140 560,168 570,115 580,172 590,125 600,155 640,155 680,155" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dashoffset" values="500;0" dur="3s" repeatCount="indefinite"/>
      <set attributeName="stroke-dasharray" to="500,500"/>
    </polyline>
  </g>

  <!-- Main title -->
  <text x="450" y="95" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="white" filter="url(#glow)">
    Awesome Error Monitoring
    <animate attributeName="opacity" values="0.95;1;0.95" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="130" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a8a8d8" letter-spacing="3">
    SaaS &amp; Open-Source Platforms
  </text>

  <!-- Decorative corner brackets -->
  <g stroke="#6c5ce7" stroke-width="2" fill="none" opacity="0.4">
    <polyline points="15,25 15,10 30,10"/>
    <polyline points="870,25 870,10 855,10"/>
    <polyline points="15,175 15,190 30,190"/>
    <polyline points="870,175 870,190 855,190"/>
  </g>
</svg>
